<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Dockside | Sunday dispatch</title>
  <link rel="icon" href="/assembly/art/dispatch.png" type="image/png">
  <link rel="stylesheet" href="/assembly/assembly.css">
  <link rel="stylesheet" href="/assembly/depgraph.css">
  <script defer src="/assembly/transport-map.js"></script>
  <script defer src="/assembly/operations.js"></script>
  <script defer src="/assembly/depgraph.js"></script>
  <script defer src="/assembly/assembly.js"></script>
</head>
<body>
<!--
Design plan, Lio deep dive slides 17–19.
Ink #18203C carries the interface, sheet #F7F8FE supports the paper artwork,
periwinkle #DDE2F9 marks the shared supply, cobalt #314EB2 marks selection,
poppy #AB301D marks a shortage, and spruce #1A6756 marks covered stock.
Barlow Semi Condensed sets stage names and the deadline. Atkinson Hyperlegible
Next sets the operating text. Labels and values align directly to the artwork.

  Sunday dispatch                                Sun 20:00
                    [steel] [tray] [book] [map] [statue]   → [Collector’s box]
  [card] [leaflet] <
                    [clear case] [sleeve]                 → [Standard box]
  Select a part to open seven steps, live evidence and delivery economics.

Brief review. A supplier-first flow forced buyers to interpret freight before
seeing what they were packing. The product illustrations now carry the overview.
One shared branch replaces a duplicate card and leaflet in each edition. Stage
icons, lead times and the assumed confirmation appear only inside a part trace.
-->
<main class="shell">
  <header class="dispatch-heading">
    <div>
      <div class="workspace-line">
        <p class="workspace-name" id="workspace-name" hidden></p>
      </div>
      <h1 id="launch-title">Dispatch</h1>
    </div>
    <div class="deadline"><span class="deadline-label">Trucks leave</span><strong id="deadline">Loading</strong><span id="cutoff"></span></div>
  </header>

  <section id="next-strip" class="next-strip" aria-labelledby="next-title" hidden>
    <header><h2 id="next-title" tabindex="-1">Checking</h2><div class="strip-status">
      <span id="sync" role="status"></span>
      <span id="refresh-indicator" role="status">
        <span class="refresh-spinner" aria-hidden="true" hidden></span><span class="sr-only"></span>
      </span>
    </div></header>
    <p id="llm-banner" class="llm-banner" role="alert" hidden></p>
    <ul id="needs-you" class="needs-you" hidden></ul>
    <details id="handling" class="handling" hidden>
      <summary id="handling-note"></summary>
      <ul id="next-list"></ul>
    </details>
    <p id="chaser-count" class="side-note"></p>
  </section>

  <section id="overview" aria-label="Parts and dispatch targets">
    <p class="loading" id="initial">Loading the assembly plan.</p>
    <div class="assembly" id="assembly" hidden></div>
    <footer class="graph-footer" id="legend" hidden>
      <div class="legend" aria-label="Part status key">
        <span><i class="status-dot covered"></i> Covered</span>
        <span><i class="status-dot short"></i> Short on site</span>
        <span>Projected dispatch / target</span>
      </div>
    </footer>
  </section>

  <section class="inspector" id="inspector" aria-labelledby="part-heading" hidden></section>
  <section class="operations" id="operations" aria-labelledby="operations-title">
    <header><h2 id="operations-title" tabindex="-1">Held and closed actions</h2><p id="attention">Checking for decisions</p></header>
    <ul id="decision-list" class="decision-list"></ul>
    <div class="activity-row" id="activity-row">
      <details class="operation-details"><summary id="activity-summary">Recent activity</summary><ol id="activity-list"></ol></details>
    </div>
  </section>
</main>
<button class="chat-launcher" id="open-chat" type="button" aria-controls="dockside-chat" aria-expanded="false" aria-label="Ask Dockside" title="Ask Dockside">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
    <path d="M7 8.5h10M7 12.5h7" stroke-linecap="round"/>
  </svg>
</button>
<section class="dockside-chat" id="dockside-chat" aria-labelledby="chat-title" hidden>
  <header>
    <h2 id="chat-title">Ask Dockside</h2>
    <button class="chat-close" id="close-chat" type="button" aria-label="Close chat">&times;</button>
  </header>
  <div class="chat-content" id="chat-content">
    <p id="answer" role="status" class="answer"></p>
    <form id="ask-form" class="ask-form"><label class="sr-only" for="question">Your question</label>
      <input id="question" required placeholder="What could hold up dispatch?"><button class="action-button" type="submit">Ask</button></form>
    <div class="voice-controls">
      <button class="secondary-button" id="record-question" type="button" hidden>Speak a question</button>
      <button class="text-button" id="read-answer" type="button" hidden>Read answer aloud</button>
      <p class="side-note" id="voice-status" role="status"></p>
    </div>
  </div>
</section>
<dialog id="action-dialog" class="action-dialog" aria-labelledby="action-dialog-title">
  <header>
    <h2 id="action-dialog-title"></h2>
    <form method="dialog"><button class="secondary-button" autofocus>Close</button></form>
  </header>
  <div id="action-dialog-content"></div>
  <p id="decision-result" class="operation-result" role="status"></p>
</dialog>
<dialog id="reply-dialog" class="action-dialog reply-dialog" aria-labelledby="reply-title">
  <header>
    <h2 id="reply-title">Supplier reply</h2>
    <form method="dialog"><button class="secondary-button" autofocus>Close reply</button></form>
  </header>
  <iframe id="reply-document" title="Original supplier reply and English translation" sandbox></iframe>
</dialog>
</body>
</html>
